<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Games HTML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 380px;
            flex-direction: column;
            align-items: center;
        }

        .active-screen {
            display: flex;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #4caf50;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-secondary {
            background-color: #757575;
            margin-top: 10px;
        }

        .btn-blue {
            background-color: #2196f3;
        }

        .turn-indicator {
            font-size: 1rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
        }

        .p-blue { background-color: #2196f3; }
        .p-red { background-color: #e91e63; }

        canvas {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            touch-action: none;
        }

        /* Stili Gioco 1 */
        .legend-table {
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
            width: 100%;
        }
        .legend-table th, .legend-table td {
            border: 1px solid #ddd;
            padding: 4px;
            text-align: center;
            font-size: 0.85rem;
            width: 16.66%;
        }
        .arrow { font-size: 1.1rem; font-weight: bold; }
        .dice-container { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .dice-result {
            font-size: 1.5rem; font-weight: bold; width: 40px; height: 40px;
            background: white; border: 2px solid #333; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- MENU PRINCIPALE -->
    <div id="menuScreen" class="screen active-screen">
        <h1 style="margin-top: 40px; margin-bottom: 30px;">Scegli un Gioco</h1>
        <button class="btn" onclick="showScreen('game1Screen'); initGame1();">🎲 Corsa sulla Griglia</button>
        <button class="btn btn-blue" onclick="showScreen('game2Screen'); initGame2();">🔵🔴 Gioco dei Gettoni</button>
    </div>

    <!-- GIOCO 1: CORSA DADO -->
    <div id="game1Screen" class="screen">
        <h1>Corsa sulla Griglia</h1>
        <table class="legend-table">
            <tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
            <tr>
                <td class="arrow">&darr;</td><td class="arrow">&nearr;</td><td class="arrow">&searr;</td>
                <td class="arrow">&larr;</td><td class="arrow">&swarr;</td><td class="arrow">&darr;</td>
            </tr>
        </table>
        <div id="g1Turn" class="turn-indicator p-red">Turno: Rosa</div>
        <div class="dice-container">
            <button id="rollBtn" class="btn" onclick="rollDice()">Tira Dado 🎲</button>
            <div id="diceVal" class="dice-result">-</div>
        </div>
        <canvas id="canvas1" width="340" height="380"></canvas>
        <button class="btn btn-secondary" onclick="showScreen('menuScreen')">⬅ Menu Principale</button>
    </div>

    <!-- GIOCO 2: GETTONI STRATEGICI -->
    <div id="game2Screen" class="screen">
        <h1>Blocca l'Avversario</h1>
        <div id="g2Turn" class="turn-indicator p-blue">Turno: Blu (Seleziona gettone)</div>
        <canvas id="canvas2" width="340" height="380"></canvas>
        <button class="btn btn-secondary" onclick="initGame2()">Ricomincia</button>
        <button class="btn btn-secondary" style="margin-top: 5px;" onclick="showScreen('menuScreen')">⬅ Menu Principale</button>
    </div>

    <script>
        // Gestione Schermate
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        /* ==========================================
           LOGICA GIOCO 1: CORSA SULLA GRIGLIA
        ========================================== */
        const canvas1 = document.getElementById('canvas1');
        const ctx1 = canvas1.getContext('2d');
        const COLS = 7, ROWS = 9, PADDING1 = 30;
        const SPACING_X = (canvas1.width - PADDING1 * 2) / (COLS - 1);
        const SPACING_Y = (canvas1.height - PADDING1 * 2) / (ROWS - 1);
        const moves1 = {
            1: {dx:0, dy:1}, 2: {dx:1, dy:-1}, 3: {dx:1, dy:1},
            4: {dx:-1, dy:0}, 5: {dx:-1, dy:1}, 6: {dx:0, dy:1}
        };
        let turn1 = 1, gameOver1 = false, p1Path = [], p2Path = [];

        function initGame1() {
            turn1 = 1; gameOver1 = false;
            p1Path = [{col: 2, row: 0}]; p2Path = [{col: 4, row: 0}];
            document.getElementById('diceVal').innerText = '-';
            document.getElementById('rollBtn').disabled = false;
            updateUI1(); drawBoard1();
        }

        function updateUI1() {
            const ind = document.getElementById('g1Turn');
            ind.innerText = turn1 === 1 ? "Turno: Giocatore 1 (Rosa)" : "Turno: Giocatore 2 (Blu)";
            ind.className = turn1 === 1 ? "turn-indicator p-red" : "turn-indicator p-blue";
        }

        function rollDice() {
            if (gameOver1) return;
            let count = 0;
            document.getElementById('rollBtn').disabled = true;
            const interval = setInterval(() => {
                const roll = Math.floor(Math.random() * 6) + 1;
                document.getElementById('diceVal').innerText = roll;
                if (++count > 8) {
                    clearInterval(interval);
                    makeMove1(roll);
                }
            }, 50);
        }

        function makeMove1(val) {
            const move = moves1[val];
            const path = turn1 === 1 ? p1Path : p2Path;
            const last = path[path.length - 1];
            let nc = Math.max(0, Math.min(COLS - 1, last.col + move.dx));
            let nr = Math.max(0, Math.min(ROWS - 1, last.row + move.dy));
            path.push({col: nc, row: nr});
            drawBoard1();
            if (nr === ROWS - 1) {
                gameOver1 = true;
                alert(`🎉 Ha vinto il Giocatore ${turn1}!`);
                return;
            }
            turn1 = turn1 === 1 ? 2 : 1;
            updateUI1();
            document.getElementById('rollBtn').disabled = false;
        }

        function drawBoard1() {
            ctx1.clearRect(0, 0, canvas1.width, canvas1.height);
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx1.beginPath();
                    ctx1.arc(PADDING1 + c * SPACING_X, PADDING1 + r * SPACING_Y, 3, 0, Math.PI * 2);
                    ctx1.fillStyle = '#888'; ctx1.fill();
                }
            }
            drawPath1(p1Path, '#e91e63');
            drawPath1(p2Path, '#2196f3');
        }

        function drawPath1(path, color) {
            if (!path.length) return;
            ctx1.beginPath(); ctx1.strokeStyle = color; ctx1.lineWidth = 3;
            ctx1.moveTo(PADDING1 + path[0].col * SPACING_X, PADDING1 + path[0].row * SPACING_Y);
            for (let i = 1; i < path.length; i++) {
                ctx1.lineTo(PADDING1 + path[i].col * SPACING_X, PADDING1 + path[i].row * SPACING_Y);
            }
            ctx1.stroke();
            const last = path[path.length - 1];
            ctx1.beginPath();
            ctx1.arc(PADDING1 + last.col * SPACING_X, PADDING1 + last.row * SPACING_Y, 6, 0, Math.PI * 2);
            ctx1.fillStyle = color; ctx1.fill();
        }

        /* ==========================================
           LOGICA GIOCO 2: GETTONI STRATEGICI
        ========================================== */
        const canvas2 = document.getElementById('canvas2');
        const ctx2 = canvas2.getContext('2d');

        // Coordinate Nodi del Tavoliere
        const nodes = [
            { id: 0, x: 170, y: 30 },  // Alto centro
            { id: 1, x: 70,  y: 110 }, // Alto sx
            { id: 2, x: 270, y: 110 }, // Alto dx
            { id: 3, x: 170, y: 190 }, // Centro
            { id: 4, x: 70,  y: 270 }, // Basso sx
            { id: 5, x: 270, y: 270 }, // Basso dx
            { id: 6, x: 170, y: 350 }  // Basso centro
        ];

        // Connessioni tra i nodi
        const edges = [
            [0,1], [0,2], [1,2],
            [1,3], [2,3],
            [1,4], [2,5],
            [3,4], [3,5],
            [4,6], [5,6], [4,5]
        ];

        let boardState = []; // Mappa nodi: null, 'B', 'R'
        let turn2 = 'B'; // 'B' = Blu, 'R' = Rosso
        let selectedNode = null;
        let gameOver2 = false;

        function initGame2() {
            // Stato iniziale: 3 Blu sopra/centro, 3 Rossi sotto
            boardState = ['B', 'B', 'B', 'B', 'R', 'R', 'R'];
            boardState = [
                'B',       // Node 0
                null,      // Node 1
                'B',       // Node 2
                'B',       // Node 3 (Centro)
                'R',       // Node 4
                'R',       // Node 5
                'R'        // Node 6
            ];
            turn2 = 'B';
            selectedNode = null;
            gameOver2 = false;
            updateUI2();
            drawBoard2();
        }

        function updateUI2() {
            const ind = document.getElementById('g2Turn');
            const name = turn2 === 'B' ? "Blu" : "Rosso";
            ind.innerText = `Turno: ${name} ${selectedNode !== null ? '(Scegli destinazione)' : '(Seleziona gettone)'}`;
            ind.className = turn2 === 'B' ? "turn-indicator p-blue" : "turn-indicator p-red";
        }

        function getNeighbors(nodeId) {
            let neighbors = [];
            edges.forEach(([u, v]) => {
                if (u === nodeId) neighbors.push(v);
                if (v === nodeId) neighbors.push(u);
            });
            return neighbors;
        }

        canvas2.addEventListener('pointerdown', (e) => {
            if (gameOver2) return;
            const rect = canvas2.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Trova nodo cliccato
            const clickedNode = nodes.findIndex(n => {
                const dist = Math.hypot(n.x - clickX, n.y - clickY);
                return dist < 25;
            });

            if (clickedNode === -1) return;

            if (selectedNode === null) {
                // Seleziona proprio gettone
                if (boardState[clickedNode] === turn2) {
                    selectedNode = clickedNode;
                }
            } else {
                // Muovi gettone
                if (clickedNode === selectedNode) {
                    selectedNode = null; // Deseleziona
                } else if (boardState[clickedNode] === null && getNeighbors(selectedNode).includes(clickedNode)) {
                    // Esegui movimento
                    boardState[clickedNode] = turn2;
                    boardState[selectedNode] = null;
                    selectedNode = null;

                    // Cambia turno
                    turn2 = turn2 === 'B' ? 'R' : 'B';

                    // Controlla se il nuovo giocatore ha mosse disponibili
                    if (!hasValidMoves(turn2)) {
                        gameOver2 = true;
                        const winner = turn2 === 'B' ? "Rosso" : "Blu";
                        drawBoard2();
                        setTimeout(() => alert(`🎉 Nessuna mossa disponibile! Ha vinto il ${winner}!`), 100);
                        return;
                    }
                } else if (boardState[clickedNode] === turn2) {
                    selectedNode = clickedNode; // Cambia selezione
                }
            }
            updateUI2();
            drawBoard2();
        });

        function hasValidMoves(player) {
            for (let i = 0; i < nodes.length; i++) {
                if (boardState[i] === player) {
                    const neighbors = getNeighbors(i);
                    if (neighbors.some(nbr => boardState[nbr] === null)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function drawBoard2() {
            ctx2.clearRect(0, 0, canvas2.width, canvas2.height);

            // Disegna Linee
            ctx2.strokeStyle = '#333';
            ctx2.lineWidth = 4;
            edges.forEach(([u, v]) => {
                ctx2.beginPath();
                ctx2.moveTo(nodes[u].x, nodes[u].y);
                ctx2.lineTo(nodes[v].x, nodes[v].y);
                ctx2.stroke();
            });

            // Disegna Nodi e Gettoni
            nodes.forEach((n, idx) => {
                // Nodo base
                ctx2.beginPath();
                ctx2.arc(n.x, n.y, 8, 0, Math.PI * 2);
                ctx2.fillStyle = '#555';
                ctx2.fill();

                // Gettoni
                const piece = boardState[idx];
                if (piece) {
                    ctx2.beginPath();
                    ctx2.arc(n.x, n.y, 20, 0, Math.PI * 2);
                    ctx2.fillStyle = piece === 'B' ? '#2196f3' : '#e91e63';
                    ctx2.fill();
                    ctx2.lineWidth = 3;
                    ctx2.strokeStyle = '#fff';
                    ctx2.stroke();

                    // Foro centrale del gettone (stile immagine)
                    ctx2.beginPath();
                    ctx2.arc(n.x, n.y, 5, 0, Math.PI * 2);
                    ctx2.fillStyle = '#fff';
                    ctx2.fill();
                }

                // Evidenzia selezione
                if (selectedNode === idx) {
                    ctx2.beginPath();
                    ctx2.arc(n.x, n.y, 24, 0, Math.PI * 2);
                    ctx2.strokeStyle = '#ffeb3b';
                    ctx2.lineWidth = 4;
                    ctx2.stroke();
                }
            });
        }
    </script>
</body>
</html>
