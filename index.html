<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tris con Dado</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --player1-color: #e74c3c; /* Rosso per X */
            --player2-color: #3498db; /* Blu per O */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        h1 {
            margin: 10px 0;
            font-size: 24px;
            color: var(--primary);
        }

        /* Sezione Dado e Turni */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .dice-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dice {
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* Contenitore Griglie */
        .boards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .board-wrapper {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .board-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary);
        }

        /* Intestazione numeri/dadi sopra le colonne */
        .column-headers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 5px;
        }

        .header-cell {
            text-align: center;
            background-color: #e2e8f0;
            padding: 5px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #4a5568;
        }

        /* Griglia Tris */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .cell {
            aspect-ratio: 1;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Evidenzia la colonna valida */
        .cell.highlight {
            background-color: #fef08a;
            border-color: #eab308;
        }

        .cell.X {
            color: var(--player1-color);
        }

        .cell.O {
            color: var(--player2-color);
        }

        .reset-btn {
            margin-top: 20px;
            background-color: #e74c3c;
        }
    </style>
</head>
<body>

    <h1>Tris con Dado 🎲</h1>

    <div class="controls">
        <div class="status" id="status">Turno del Giocatore 1 (X)</div>
        <div class="dice-container">
            <button id="roll-btn" onclick="rollDice()">Tira il Dado</button>
            <div class="dice" id="dice-result">-</div>
        </div>
    </div>

    <div class="boards-container">
        <!-- Griglia 1 (Colonne 1, 2, 3) -->
        <div class="board-wrapper">
            <div class="board-title">Griglia A (Dadi 1, 2, 3)</div>
            <div class="column-headers">
                <div class="header-cell">⚀ 1</div>
                <div class="header-cell">⚁ 2</div>
                <div class="header-cell">⚂ 3</div>
            </div>
            <div class="grid" id="board-1"></div>
        </div>

        <!-- Griglia 2 (Colonne 4, 5, 6) -->
        <div class="board-wrapper">
            <div class="board-title">Griglia B (Dadi 4, 5, 6)</div>
            <div class="column-headers">
                <div class="header-cell">⚃ 4</div>
                <div class="header-cell">⚄ 5</div>
                <div class="header-cell">⚅ 6</div>
            </div>
            <div class="grid" id="board-2"></div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetGame()">Nuova Partita</button>

    <script>
        let currentPlayer = 'X';
        let currentRoll = null;
        let gameState = {
            board1: Array(9).fill(''),
            board2: Array(9).fill('')
        };
        let isGameOver = false;

        const diceSymbols = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        // Inizializza le griglie
        function initGame() {
            createGrid('board-1', 1);
            createGrid('board-2', 2);
            updateStatus();
        }

        function createGrid(boardId, boardNum) {
            const boardEl = document.getElementById(boardId);
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.board = boardNum;
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(boardNum, i));
                boardEl.appendChild(cell);
            }
        }

        // Tira il dado
        function rollDice() {
            if (isGameOver || currentRoll !== null) return;

            const diceBtn = document.getElementById('roll-btn');
            diceBtn.disabled = true;

            // Animazione semplice del dado
            let rolls = 0;
            const interval = setInterval(() => {
                const random = Math.floor(Math.random() * 6) + 1;
                document.getElementById('dice-result').textContent = diceSymbols[random];
                rolls++;
                if (rolls > 8) {
                    clearInterval(interval);
                    currentRoll = Math.floor(Math.random() * 6) + 1;
                    document.getElementById('dice-result').textContent = diceSymbols[currentRoll] + " (" + currentRoll + ")";
                    highlightValidColumns();
                    checkAvailableMoves();
                }
            }, 60);
        }

        // Evidenzia le caselle giocabili
        function highlightValidColumns() {
            clearHighlights();
            if (!currentRoll) return;

            // Determina quale griglia e colonna corrisponde al numero
            // Griglia 1: 1 -> Col 0, 2 -> Col 1, 3 -> Col 2
            // Griglia 2: 4 -> Col 0, 5 -> Col 1, 6 -> Col 2
            const targetBoard = currentRoll <= 3 ? 1 : 2;
            const colIndex = (currentRoll - 1) % 3;

            const cells = document.querySelectorAll(`[data-board="${targetBoard}"]`);
            cells.forEach((cell, idx) => {
                const boardArray = targetBoard === 1 ? gameState.board1 : gameState.board2;
                if (idx % 3 === colIndex && boardArray[idx] === '') {
                    cell.classList.add('highlight');
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight'));
        }

        // Gestione del click sulla casella
        function handleCellClick(boardNum, index) {
            if (isGameOver || currentRoll === null) return;

            // Verifico se la colonna della casella corrisponde al dado uscito
            const targetBoard = currentRoll <= 3 ? 1 : 2;
            const colIndex = (currentRoll - 1) % 3;

            if (boardNum === targetBoard && index % 3 === colIndex) {
                const boardArray = boardNum === 1 ? gameState.board1 : gameState.board2;
                
                if (boardArray[index] === '') {
                    boardArray[index] = currentPlayer;
                    render();

                    if (checkWin(boardArray, currentPlayer)) {
                        document.getElementById('status').textContent = `🎉 Il Giocatore ${currentPlayer} ha vinto!`;
                        isGameOver = true;
                        clearHighlights();
                        return;
                    }

                    // Passa al giocatore successivo
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    currentRoll = null;
                    document.getElementById('dice-result').textContent = '-';
                    document.getElementById('roll-btn').disabled = false;
                    clearHighlights();
                    updateStatus();
                }
            }
        }

        // Se non ci sono mosse disponibili per quel dado, salta il turno
        function checkAvailableMoves() {
            const targetBoard = currentRoll <= 3 ? 1 : 2;
            const colIndex = (currentRoll - 1) % 3;
            const boardArray = targetBoard === 1 ? gameState.board1 : gameState.board2;

            let hasValidMove = false;
            for (let i = colIndex; i < 9; i += 3) {
                if (boardArray[i] === '') {
                    hasValidMove = true;
                    break;
                }
            }

            if (!hasValidMove) {
                setTimeout(() => {
                    alert(`Nessuna mossa disponibile nella colonna del numero ${currentRoll}! Turno passato.`);
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    currentRoll = null;
                    document.getElementById('dice-result').textContent = '-';
                    document.getElementById('roll-btn').disabled = false;
                    clearHighlights();
                    updateStatus();
                }, 500);
            }
        }

        function checkWin(board, player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8], // Orizzontali
                [0,3,6], [1,4,7], [2,5,8], // Verticali
                [0,4,8], [2,4,6]          // Diagonali
            ];
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function updateStatus() {
            if (!isGameOver) {
                document.getElementById('status').textContent = `Turno: Giocatore ${currentPlayer === 'X' ? '1 (X)' : '2 (O)'}`;
            }
        }

        function render() {
            [1, 2].forEach(bNum => {
                const boardArray = bNum === 1 ? gameState.board1 : gameState.board2;
                const cells = document.querySelectorAll(`[data-board="${bNum}"]`);
                cells.forEach((cell, i) => {
                    cell.textContent = boardArray[i];
                    cell.className = 'cell ' + boardArray[i];
                });
            });
        }

        function resetGame() {
            currentPlayer = 'X';
            currentRoll = null;
            gameState = { board1: Array(9).fill(''), board2: Array(9).fill('') };
            isGameOver = false;
            document.getElementById('dice-result').textContent = '-';
            document.getElementById('roll-btn').disabled = false;
            clearHighlights();
            render();
            updateStatus();
        }

        initGame();
    </script>
</body>
</html>
